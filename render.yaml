services:
  - type: web
    name: hire
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hire-db
          property: connectionString
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MAYA_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: cron
    name: hire-keepalive
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: curl -fsS https://hire-brjt.onrender.com/api/health

databases:
  - name: hire-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: hire
    user: hire
