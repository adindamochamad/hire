services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hire
      POSTGRES_PASSWORD: hire
      POSTGRES_DB: hire
    ports:
      - "5432:5432"
    volumes:
      - hire_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  hire_pg:
